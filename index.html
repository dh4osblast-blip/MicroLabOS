<style>
:root{--n:#102040;--b:#1B6FD1;--s:#4AA3FF;--g:#4A5A78;--a:#F5A524;--l:#d9e0ec}
*{box-sizing:border-box}
body{margin:0;font:500 14px/1.5 Poppins,system-ui,sans-serif;color:var(--g)}
#app{display:flex;min-height:100vh}
nav{width:220px;background:var(--n);color:#fff;padding:24px 0;flex:none;display:flex;flex-direction:column}
.sig{font-weight:700;font-size:26px;line-height:1;color:var(--n)}
.sig b{color:var(--b)}
.sig small{display:block;font:500 11px Poppins,system-ui,sans-serif;margin-top:4px;color:var(--g)}
nav .sig,.dk .sig{color:#fff}
nav .sig b,.dk .sig b{color:var(--s)}
nav .sig small,.dk .sig small{color:#c8d4ea}
nav .sig{padding:0 24px 24px}
nav button{all:unset;display:block;padding:9px 24px;color:#c8d4ea;cursor:pointer}
nav button.on{color:#fff;background:#16305c;box-shadow:inset 3px 0 var(--s)}
nav button:focus-visible{outline:2px solid var(--s)}
.me{margin-top:auto;padding:16px 0 0;font-size:12px;color:#c8d4ea}.me div{padding:0 24px}
main{flex:1;padding:28px 36px;min-width:0}
h1{margin:0;font-size:22px;color:var(--n)}h2{font-size:16px;color:var(--n);margin:24px 0 8px}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--l)}
th{color:var(--n);font-size:12px}td.ac{text-align:right;white-space:nowrap}
.btn{font:700 13px Poppins,system-ui,sans-serif;border:2px solid var(--b);background:var(--b);color:#fff;padding:7px 16px;border-radius:6px;cursor:pointer;display:inline-block}
.btn.g{background:#fff;color:var(--b)}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--s);outline-offset:1px}
label{display:block;font-size:12px}
input,select,textarea{width:100%;font:500 14px Poppins,system-ui,sans-serif;padding:8px;border:1.5px solid var(--l);border-radius:6px;color:var(--n);background:#fff}
.row{display:flex;gap:12px;align-items:end;flex-wrap:wrap;margin:8px 0}.row label{width:auto}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fg .w,.w{grid-column:1/-1}
dialog{border:0;border-radius:8px;padding:24px;width:92%;max-width:760px}
dialog::backdrop{background:rgba(16,32,64,.5)}
.ir{display:grid;grid-template-columns:1.2fr 1.6fr 60px 90px 38px;gap:6px;margin:6px 0}
.home{border-radius:8px;min-height:440px;padding:48px;display:flex;flex-direction:column;justify-content:space-between;border:1px solid var(--l)}
.home.dk{color:#fff}.home .sig{font-size:44px}.lg{max-height:100px;max-width:100%}.av{width:44px;height:44px;border-radius:10px;margin:0 24px 12px;display:block}.kp>div{min-width:140px}pre{white-space:pre-wrap;background:#F3F6FB;padding:12px;border-radius:6px;font:500 12px Poppins,system-ui,sans-serif}a.btn{text-decoration:none}
.hi p{font-size:16px;margin:12px 0}
.kp{display:flex;gap:40px;flex-wrap:wrap}.kp span{display:block;font-weight:700;font-size:28px;color:var(--n)}.dk .kp span{color:#fff}
.lgn{margin:12vh auto;width:320px}.lgn .sig{font-size:36px;margin-bottom:28px}.lgn form{display:grid;gap:12px}
.nt{font-size:12px;max-width:70ch}
#doc{display:none}
.ph{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--n);padding-bottom:12px;color:var(--n)}
.sg{margin-top:56px;border-top:1px solid var(--n);width:260px;font-size:12px}
@media(max-width:800px){#app{flex-direction:column}nav{width:auto;flex-direction:row;flex-wrap:wrap;padding:12px}nav .sig{padding:0 12px}nav button{padding:6px 12px}.me{display:none}main{padding:20px}.fg{grid-template-columns:1fr}.ir{grid-template-columns:1fr 1fr}}
@media print{nav,.hd button,td.ac,.nop,dialog{display:none!important}#app{display:block}main{padding:0}body.pdoc #app{display:none}body.pdoc #doc{display:block;color:#000}}
</style>

async function hash(p){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('ml:'+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return btoa('ml:'+p)}}

const PERM={'Administrador':'*','Atendente':['home','os','orc','vendas','clientes','aniv','receber','rel','pix'],'Vendedor':['home','vendas','orc','clientes','aniv','estoque','pix'],'Técnico':['home','os','estoque']};
const can=v=>PERM[user.nivel]==='*'||PERM[user.nivel].includes(v);
const V=[['home','Início'],['os','Ordens de serviço'],['orc','Orçamentos'],['vendas','Vendas'],['clientes','Clientes'],['aniv','Aniversariantes'],['estoque','Estoque'],['compras','Pedidos de compra'],['fornecedores','Fornecedores'],['vendedores','Vendedores'],['tecnicos','Técnicos'],['receber','Contas a receber'],['fin','Financeiro'],['pix','Gerador de PIX'],['rel','Relatórios'],['stats','Estatísticas'],['cfg','Configurações']];

clientes:{t:'Clientes',k:'clientes',f:[['foto','Foto','f'],['nome','Nome','r'],['tel','WhatsApp'],['email','E-mail'],['nasc','Nascimento','d'],['ig','Instagram'],['obs','Observações']],c:['foto','nome','tel','email','nasc']},
fornecedores:{t:'Fornecedores',k:'fornecedores',f:[['nome','Nome','r'],['contato','Contato'],['tel','Telefone'],['email','E-mail'],['obs','Observações']],c:['nome','contato','tel','email']},
vendedores:{t:'Vendedores',k:'vendedores',f:[['nome','Nome','r'],['tel','Telefone'],['email','E-mail'],['obs','Observações']],c:['nome','tel','email']},

const low=p=>(+p.qtd||0)<0||(+p.min>0&&(+p.qtd||0)<=+p.min);
const fmt=(k,v,r)=>k=='qtd'&&r&&low(r)?`${esc(v)} <span style="background:var(--a);color:var(--n);padding:2px 8px;border-radius:10px;font-size:11px">repor</span>`:k=='foto'?(v?`<img src="${v}" width="36" height="36" style="border-radius:50%;object-fit:cover" alt="">`:''):k=='nasc'?D(v):['custo','preco'].includes(k)?R(v):esc(v);

function auth(){user=null;const U=db.users;
$('#app').innerHTML=`<div class="lgn"><img class="av" style="margin:0 0 16px" src="${AV}" alt=""><div class="sig">Micro<b>Lab</b><small>Assistência técnica</small></div><form onsubmit="return ent(event)">${U.length?`<label>Usuário<select name="u">${U.map(u=>`<option value="${u.id}">${esc(u.nome)} · ${u.nivel}</option>`).join('')}</select></label>`:`<h2>Primeiro acesso</h2><label>Seu nome<input name="nome" required></label>`}<label>PIN (mínimo 4 dígitos)<input name="pin" type="password" inputmode="numeric" minlength="4" required></label><button class="btn">${U.length?'Entrar':'Criar administrador'}</button><p id="er"></p></form></div>`}
const enc=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
async function hp(pin,salt){if(crypto.subtle){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveBits']);return'p3:'+enc(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:new TextEncoder().encode(salt),iterations:150000},k,256))}return'p3x:'+await hash(salt+pin)}
async function ent(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),U=db.users;
if(!U.length){const s=uid()+uid();user={id:uid(),nome:f.nome,nivel:'Administrador',s,h:await hp(f.pin,s)};U.push(user);save();shell();return false}
const lk=JSON.parse(localStorage.getItem('ml_lk')||'{}'),w=Math.ceil(((lk.until||0)-Date.now())/1000);
if(w>0){$('#er').textContent=`Muitas tentativas. Aguarde ${w} s.`;return false}
const u=U.find(x=>x.id==f.u);let ok=false;
if(u.s)ok=await hp(f.pin,u.s)==u.h;
else if(u.h==await hash(f.pin)||u.h==btoa('ml:'+f.pin)){ok=true;u.s=uid()+uid();u.h=await hp(f.pin,u.s);save()}
if(!ok){lk.n=(lk.n||0)+1;if(lk.n>=5)lk.until=Date.now()+30000*(lk.n-4);localStorage.setItem('ml_lk',JSON.stringify(lk));$('#er').textContent='PIN incorreto.';return false}
localStorage.removeItem('ml_lk');user=u;shell();return false}
function shell(){idle();$('#app').innerHTML=`<nav><img class="av" src="${AV}" alt=""><div class="sig">Micro<b>Lab</b><small>Assistência técnica</small></div>${V.filter(v=>can(v[0])).map(v=>`<button data-v="${v[0]}" onclick="go('${v[0]}')">${v[1]}</button>`).join('')}<div class="me"><div>${esc(user.nome)} · ${user.nivel}</div><button onclick="auth()">Sair</button></div></nav><main id="mn"></main>`;go('home')}
function go(v){cur=v;document.querySelectorAll('nav button[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v==v));
const W={home,os:()=>osList('Ordens de serviço',()=>1),orc:()=>osList('Orçamentos',o=>o.st=='Orçamento','Orçamento'),vendas,clientes:()=>crud('clientes'),aniv,estoque:()=>crud('estoque'),compras,fornecedores:()=>crud('fornecedores'),vendedores:()=>crud('vendedores'),tecnicos:()=>crud('tecnicos'),receber,fin,pix,rel,stats,cfg};
$('#mn').innerHTML=W[v]()}

function bgcss(){const c=db.cfg;return c.bgImg?`background:linear-gradient(rgba(255,255,255,.88),rgba(255,255,255,.88)),url(${c.bgImg}) center/cover`:`background:${c.bg}`}
function home(){const ab=db.os.filter(o=>!['Entregue','Cancelado'].includes(o.st)).length,aq=db.os.filter(o=>o.st=='Orçamento').length,rc=db.os.filter(o=>['Pronto','Entregue'].includes(o.st)).reduce((a,o)=>a+Math.max(0,tot$(o)-o.pago),0),sd=db.fin.reduce((a,x)=>a+(x.t=='e'?x.v:-x.v),0);
const dk=!db.cfg.bgImg&&db.cfg.bg=='#102040',lg=dk?(db.cfg.logoD||LG_D):(db.cfg.logoL||LG_L);
return`<div class="home ${dk?'dk':''}" style="${bgcss()}"><div class="hi"><img class="lg" src="${lg}" alt="MicroLab"><div class="sig" style="margin-top:12px">Micro<b>Lab</b><small>Assistência técnica</small></div><p>Orçamento antes do serviço.</p>${bkn()}</div><div class="kp"><div><span>${ab}</span>OS em aberto</div><div><span>${aq}</span>Orçamentos pendentes</div><div><span>${R(rc)}</span>A receber</div><div><span>${R(sd)}</span>Saldo do caixa</div><div><span>${db.produtos.filter(low).length}</span>Itens para repor</div></div></div>`}

function crud(v){const c=C[v],L=db[c.k];

function dlF(id){if(confirm('Excluir este lançamento?')){db.fin=db.fin.filter(x=>x.id!=id);save();go(cur)}}

function aniv(){const L=db.clientes.filter(c=>c.nasc&&+c.nasc.slice(5,7)==am).sort((a,b)=>a.nasc.slice(8)-b.nasc.slice(8));
return`<div class="hd"><h1>Aniversariantes</h1><select style="width:auto" onchange="am=+this.value;go('aniv')">${'Janeiro Fevereiro Março Abril Maio Junho Julho Agosto Setembro Outubro Novembro Dezembro'.split(' ').map((m,i)=>`<option value="${i+1}" ${i+1==am?'selected':''}>${m}</option>`).join('')}</select></div><table><tr><th><th>Nome<th>Dia<th></tr>${L.map(c=>`<tr><td>${fmt('foto',c.foto)}<td>${esc(c.nome)}<td>${c.nasc.slice(8)}<td class="ac"><a class="btn g" target="_blank" href="https://wa.me/${dg(c.tel)}?text=${encodeURIComponent('Feliz aniversário, '+c.nome.split(' ')[0]+'! Um abraço da MicroLab.')}">Parabenizar</a></tr>`).join('')||'<tr><td colspan="4">Ninguém neste mês.'}</table>`}

function stats(){const m={};db.produtos.forEach(p=>m[p.id]={n:p.nome,q:0,v:0});const cl={},ok=db.os.filter(o=>o.st=='Entregue'),vd=db.vendas.filter(o=>!o.st);
[...ok,...vd].forEach(o=>{o.itens.forEach(x=>{if(m[x.p]){m[x.p].q+=x.q;m[x.p].v+=x.q*x.v}});if(o.cli)cl[o.cli]=(cl[o.cli]||0)+tot$(o)});
const P=Object.values(m).sort((a,b)=>b.q-a.q),K=Object.entries(cl).sort((a,b)=>b[1]-a[1]).slice(0,10),tb=L=>`<table>${L.map(p=>`<tr><td>${esc(p.n)}<td>${p.q} un.<td>${R(p.v)}</tr>`).join('')||'<tr><td>Sem dados ainda.'}</table>`;
return`<h1>Estatísticas</h1><h2>Produtos mais vendidos</h2>${tb(P.slice(0,5))}<h2>Produtos menos vendidos</h2>${tb(P.slice(-5).reverse())}<h2>Melhores clientes</h2><table>${K.map(([id,v],i)=>`<tr><td>${i+1}º<td>${esc(cn(id))}<td>${R(v)}</tr>`).join('')||'<tr><td>Sem dados ainda.'}</table>${giro([...ok,...vd])}<p class="nt">Considera vendas e OS entregues com peças do estoque. A estimativa de duração usa a média dos últimos 90 dias e vale pouco com poucos dados.</p>`}

function reaj(){opn(`<h2>Reajuste de preços</h2><form class="fg" onsubmit="return svRj(event)"><label>Percentual (%), negativo reduz<input name="p" type="number" step="0.01" required></label><label>Aplicar em<select name="c"><option value="preco">Preço de venda</option><option value="custo">Custo</option></select></label><p class="w nt">Vale para todos os itens do estoque. Faça um backup antes.</p>${foot()}</form>`)}
function svRj(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));if(!confirm(`Reajustar ${f.p}% em ${db.produtos.length} itens?`))return false;db.produtos.forEach(p=>p[f.c]=Math.round((p[f.c]||0)*(1+f.p/100)*100)/100);save();dl.close();go(cur);return false}

const crc16=s=>{let c=0xFFFF;for(let i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(let j=0;j<8;j++)c=c&0x8000?((c<<1)^0x1021)&0xFFFF:(c<<1)&0xFFFF}return c.toString(16).toUpperCase().padStart(4,'0')};
const tl=(i,v)=>i+String(v.length).padStart(2,'0')+v,na=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase();
function pixCode(v,t){const c=db.cfg;const p=tl('00','01')+tl('01','11')+tl('26',tl('00','BR.GOV.BCB.PIX')+tl('01',c.pixKey))+tl('52','0000')+tl('53','986')+(v>0?tl('54',v.toFixed(2)):'')+tl('58','BR')+tl('59',na(c.pixNome||'MICROLAB').slice(0,25))+tl('60',na(c.pixCid||'SALVADOR').slice(0,15))+tl('62',tl('05',(t||'').replace(/[^A-Za-z0-9]/g,'').slice(0,25)||'***'))+'6304';return p+crc16(p)}
function pix(){if(!db.cfg.pixKey)return'<h1>Gerador de PIX</h1><p>Cadastre sua chave Pix em Configurações antes de gerar cobranças.</p>';
return`<h1>Gerador de PIX</h1><div class="row"><label>Valor (R$)<input id="pv" type="number" step="0.01" min="0" value="${pxv.v}"></label><label>Identificador (opcional)<input id="pt" value="${esc(pxv.t)}" maxlength="25"></label><button class="btn" onclick="pxg()">Gerar</button></div><div id="pxo"></div><p class="nt">Valor em branco gera um código em que o cliente digita o valor.</p>`}
function pxg(){const cd=pixCode(+$('#pv').value,$('#pt').value);$('#pxo').innerHTML=`<div id="qr" style="margin:16px 0"></div><label>Pix copia e cola<textarea rows="4" readonly id="pc">${cd}</textarea></label><p><button class="btn g" onclick="navigator.clipboard.writeText($('#pc').value)">Copiar código</button></p>`;try{const q=qrcode(0,'M');q.addData(cd);q.make();$('#qr').innerHTML='<img alt="QR do Pix" src="'+q.createDataURL(5,2)+'">'}catch(e){$('#qr').textContent='Não foi possível gerar o QR. Use o copia e cola.'}}

function cfg(){const fb=(k,t)=>`<label class="btn g">${t}<input type="file" accept="image/*" hidden onchange="up('${k}',this)"></label>`,pf=(k,l)=>`<label>${l}<input value="${esc(db.cfg[k])}" onchange="db.cfg.${k}=this.value.trim();save()"></label>`;
return`<h1>Configurações</h1>
<h2>Fundo da tela inicial</h2><div class="row">${[['#ffffff','Branco'],['#F3F6FB','Cinza claro'],['#102040','Azul-marinho']].map(([c,n])=>`<button class="btn g" onclick="db.cfg.bg='${c}';delete db.cfg.bgImg;save();go('cfg')">${n}</button>`).join('')}${fb('bgImg','Usar imagem')}</div>
<h2>Logomarca</h2><p class="nt">A logo da MicroLab já vem instalada. Envie outras só se quiser trocar.</p><div class="row">${fb('logoL','Logo para fundo claro (azul-marinho)')}${fb('logoD','Logo para fundo escuro (branca)')}<button class="btn g" onclick="delete db.cfg.logoL;delete db.cfg.logoD;save();go('cfg')">Voltar à logo padrão</button></div>
<h2>Chave Pix</h2><div class="row">${pf('pixKey','Chave Pix')}${pf('pixNome','Nome do recebedor')}${pf('pixCid','Cidade')}</div><p class="nt">Usados no gerador de PIX. Confira o código no app do seu banco antes de cobrar.</p>
<h2>Condições impressas na OS</h2><textarea rows="3" onchange="db.cfg.cond=this.value;save()">${esc(db.cfg.cond)}</textarea><p class="nt">Escreva só o que você cumpre (garantia, prazo para retirada, etc.).</p>
<h2>Usuários e níveis</h2><div class="row">${pf('idle','Sair sozinho após (minutos; 0 desliga; padrão 10)')}</div><table>${db.users.map(u=>`<tr><td>${esc(u.nome)}<td>${u.nivel}<td class="ac"><button class="btn g" onclick="delU('${u.id}')">Excluir</button></tr>`).join('')}</table>
<form class="row" onsubmit="return addU(event)"><label>Nome<input name="nome" required></label><label>Nível<select name="nivel"><option>Administrador</option><option>Atendente</option><option>Vendedor</option><option>Técnico</option></select></label><label>PIN<input name="pin" type="password" inputmode="numeric" minlength="4" required></label><button class="btn">Adicionar</button></form>
<p class="nt">Atendente: clientes, OS, orçamentos, vendas, receber, relatórios e Pix. Vendedor: vendas, orçamentos, clientes, estoque e Pix. Técnico: OS e estoque. O PIN organiza o uso no balcão, mas não protege os dados contra quem abrir o navegador deste computador. Depois de 5 erros a tela espera alguns segundos, e o sistema sai sozinho após um tempo parado. Use também senha no Windows.</p>
<h2>Backup</h2><div class="row"><button class="btn" onclick="exp()">Baixar backup</button>${fb('x','Restaurar backup').replace("up('x',this)","imp(this)").replace('image/*','.json')}</div><p class="nt">Os dados ficam só neste navegador. Baixe um backup com frequência. O arquivo contém dados de clientes: guarde com cuidado.</p>`}

const idleMin=()=>db.cfg.idle===undefined||db.cfg.idle===''?10:+db.cfg.idle||0;
let idleT;function idle(){clearTimeout(idleT);const m=idleMin();if(!user||!m)return;idleT=setTimeout(()=>{if(dl.open)return idle();auth()},m*6e4)}
['click','keydown','touchstart'].forEach(e=>addEventListener(e,idle,{passive:true}));
function bkn(){const b=db.cfg.lastBk,d=b?Math.floor((Date.now()-new Date(b))/864e5):null;
return d===null||d>7?`<p class="nt" style="background:var(--a);color:var(--n);display:inline-block;padding:4px 12px;border-radius:6px">${d===null?'Nenhum backup feito ainda.':'Último backup há '+d+' dias.'} Baixe um em Configurações.</p>`:''}
function giro(L){const lim=new Date(Date.now()-90*864e5).toISOString().slice(0,10),g={};L.filter(o=>o.data>=lim).forEach(o=>o.itens.forEach(x=>{if(x.p)g[x.p]=(g[x.p]||0)+x.q}));
const val=db.produtos.reduce((a,p)=>a+Math.max(0,+p.qtd||0)*(+p.custo||0),0);
return`<h2>Giro do estoque (últimos 90 dias)</h2><p>Valor parado em estoque, a preço de custo: <b>${R(val)}</b></p><table><tr><th>Item<th>Em estoque<th>Mínimo<th>Saíram<th>Dura cerca de</tr>${db.produtos.map(p=>{const v=g[p.id]||0,c=v?Math.max(0,Math.round((+p.qtd||0)/(v/90))):null;return`<tr><td>${esc(p.nome)}<td>${p.qtd}<td>${p.min||'-'}<td>${v}<td>${c==null?'sem saída':c+' dias'}</tr>`}).join('')||'<tr><td colspan="5">Nenhum item no estoque.'}</table>`}
if('serviceWorker' in navigator&&location.protocol!='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
auth();
</script>
</body>
</html>
